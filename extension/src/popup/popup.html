<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Apertus privacy</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <header>
    <h1>Apertus privacy</h1>
    <label class="master"><input id="enabled" type="checkbox"> On for Gemini</label>
  </header>
  <button id="log-btn" type="button">Error log</button>
  <pre id="log" hidden></pre>
  <p class="hint">Checked types are replaced with fakes before send, then shown again in the chat.</p>
  <div id="groups"></div>
  <label class="fallback">
    <input id="fallback" type="checkbox">
    If the model fails, mask with patterns only
  </label>
</body>
<script type="module" src="./popup/popup.js"></script>
</html>
